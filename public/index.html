<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>それいゆ訪問看護ステーション</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="/">それいゆ訪問看護ステーション</a>
  <nav>
    <a href="/">トップ</a>
    <a href="/staff/">スタッフ紹介</a>
    <a href="/news/">お知らせ・勉強会</a>
  </nav>
</header>
<main>
  <!-- ▼ ここに既存の index.html（バナー・理念・取り組み・バリュー等）の中身を移植 -->
  <section class="hero">
    <h1>それいゆ訪問看護ステーション</h1>
    <p>（キャッチコピー）</p>
  </section>
  <!-- ▲ ここまで固定部分（microCMSでは編集しない） -->

  <!-- 最新のお知らせ：microCMSから自動表示 -->
  <section class="container">
    <h2>最新のお知らせ</h2>
    <ul class="news-list" id="latest-news"><li class="empty">読み込み中…</li></ul>
    <p class="more"><a href="/news/">お知らせ一覧へ →</a></p>
  </section>
</main>
<footer class="site-footer">© それいゆ訪問看護ステーション</footer>

<script>
(async () => {
  const ul = document.getElementById('latest-news');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  try {
    const { items } = await (await fetch('/api/news?limit=3')).json();
    ul.innerHTML = items.length
      ? items.map((n) => `<li><a href="${esc(n.url)}"><time>${esc(n.date)}</time><span class="tag">${esc(n.category)}</span><span class="title">${esc(n.title)}</span></a></li>`).join('')
      : '<li class="empty">現在お知らせはありません。</li>';
  } catch {
    ul.innerHTML = '<li class="empty">お知らせを読み込めませんでした。</li>';
  }
})();
</script>
</body>
</html>
